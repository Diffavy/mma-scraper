<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fighter Comparison</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body>

  <header>
    <h1>Fighter Comparison</h1>
  </header>

  <main class="comparison-grid">

    <!-- Fighter 1 -->
    <div class="fighter-card" id="fighter-left">
      <h2 class="fighter-name">Loading...</h2>
      <div class="search-wrapper">
        <input id="name-1" type="text" required placeholder="Islam Makhachev"/>
        <ul class="dropdown" id="fighter1">
        </ul>
      </div>
    </div>

    <!-- Divider -->
    <div class="divider">
      <ul class="stats">
        <li>Weight Class</li>
        <li>Age</li>
        <li>Height</li>
        <li>Record</li>
        <li>Nationality</li>
        <li>D.O.B</li>
        <li>Last 5 fights</li>
        <li>Fight History</li>
      </ul>

    </div>

    <!-- Fighter 2 -->
    <div class="fighter-card" id="fighter-right">
      <h2 class="fighter-name">Loading...</h2>
      <div class="search-wrapper">
        <input id="name-2" type="text" required placeholder="Tom Aspinall"/>
        <ul class="dropdown" id="fighter2">
      </div>

      </ul>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
